<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>利用 GGB 进行尺规作图 · 1.5 角含半角模型</title>
    <script src="https://www.geogebra.org/apps/deployggb.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px 8px;
        }
        .container {
            max-width: 1280px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            color: white;
            padding: 14px 18px;
            position: relative;
            overflow: hidden;
        }
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -10%;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(102,126,234,0.3) 0%, transparent 70%);
            border-radius: 50%;
        }
        .header-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 14px rgba(102,126,234,0.4);
            flex-shrink: 0;
        }
        .header-text h1 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }
        .header-text p {
            font-size: 10px;
            opacity: 0.8;
            font-weight: 300;
        }
        .version-badge {
            margin-left: auto;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 5px 10px;
            border-radius: 14px;
            font-size: 10px;
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(102,126,234,0.3);
            flex-shrink: 0;
        }
        /* v1.9.4 切换按钮组样式 */
        .toggle-group {
            display: flex;
            gap: 6px;
            margin-left: 10px;
            flex-shrink: 0;
        }
        .toggle-btn {
            background: rgba(255,255,255,0.15);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .toggle-btn:hover {
            background: rgba(255,255,255,0.25);
            transform: translateY(-1px);
        }
        .toggle-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            border-color: transparent;
            box-shadow: 0 2px 8px rgba(245,87,108,0.4);
        }
        @media (max-width: 768px) {
            .toggle-group { margin-left: 6px; gap: 4px; }
            .toggle-btn { padding: 4px 7px; font-size: 10px; }
            .toggle-btn span { display: none; }
        }
        .tabs {
            background: linear-gradient(180deg, #f8f9fc 0%, #eef0f5 100%);
            border-bottom: 2px solid #e8eaf0;
            display: grid;
            grid-template-columns: repeat(9, 1fr);
            gap: 2px;
            padding: 6px;
        }
        .tab {
            padding: 8px 4px;
            text-align: center;
            cursor: pointer;
            font-size: 11px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
            border: none;
            background: transparent;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }
        .tab:hover {
            color: #667eea;
            background: rgba(102,126,234,0.08);
        }
        .tab.active {
            color: #667eea;
            font-weight: 600;
            background: white;
            box-shadow: 0 2px 8px rgba(102,126,234,0.15);
        }
        .tab-icon { font-size: 18px; }
        .tab-label { font-size: 10px; }
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .ggb-wrapper {
            padding: 12px;
            background: linear-gradient(180deg, #f8f9fc 0%, #ffffff 100%);
            flex: 1;
        }
        .ggb-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 1px solid #eef0f5;
            height: 100%;
            position: relative;
        }
        #ggb-element { width: 100%; height: 100%; min-height: 600px; }
        /* v1.9.7 缩放按钮组样式 */
        .zoom-controls {
            position: absolute;
            top: 12px;
            right: 12px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .zoom-btn {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            background: rgba(255,255,255,0.95);
            color: #333;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: all 0.2s ease;
            user-select: none;
        }
        .zoom-btn:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
            transform: scale(1.05);
        }
        .zoom-btn:active {
            transform: scale(0.95);
        }
        @media (max-width: 768px) {
            .zoom-controls { top: 8px; right: 8px; gap: 4px; }
            .zoom-btn { width: 32px; height: 32px; font-size: 12px; }
        }
        /* v1.9.6 可折叠说明面板样式 */
        .info-panel {
            margin-top: 12px;
            background: linear-gradient(135deg, #f8f9ff 0%, #f0f4ff 100%);
            border-radius: 10px;
            border-left: 4px solid #667eea;
            overflow: hidden;
        }
        .info-header {
            padding: 12px 16px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .info-header:hover {
            background: rgba(102, 126, 234, 0.08);
        }
        .info-title {
            font-size: 15px;
            font-weight: 700;
            color: #2d3748;
        }
        .info-toggle {
            font-size: 12px;
            color: #667eea;
            transition: transform 0.3s ease;
        }
        .info-panel.expanded .info-toggle {
            transform: rotate(180deg);
        }
        .info-content {
            padding: 0 16px 14px 16px;
        }
        .info-desc {
            font-size: 13px;
            line-height: 1.7;
            color: #4a5568;
            margin-bottom: 10px;
        }
        .info-op {
            font-size: 12px;
            line-height: 1.6;
            color: #718096;
            padding: 8px 12px;
            background: rgba(102, 126, 234, 0.08);
            border-radius: 6px;
            display: flex;
            align-items: flex-start;
            gap: 6px;
        }
        .info-op::before {
            content: "🖱️";
            flex-shrink: 0;
        }
        @media (max-width: 768px) {
            .info-header { padding: 10px 12px; }
            .info-title { font-size: 14px; }
            .info-content { padding: 0 12px 12px 12px; }
            .info-desc { font-size: 12px; }
            .info-op { font-size: 11px; }
        }
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 500px;
            color: #999;
            gap: 12px;
        }
        .loading-spinner {
            width: 36px;
            height: 36px;
            border: 3px solid #e8eaf0;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { font-size: 13px; font-weight: 500; color: #666; }
        .footer {
            padding: 10px 16px;
            background: linear-gradient(135deg, #fff9e6 0%, #fff3cd 100%);
            border-top: 1px solid #ffe082;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .footer-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, #ffc107, #ff9800);
            border-radius: 7px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(255,152,0,0.3);
        }
        .footer-text { flex: 1; }
        .footer-text strong { color: #856404; font-size: 13px; display: block; margin-bottom: 4px; }
        .footer-text p { color: #856404; font-size: 11px; opacity: 0.9; line-height: 1.6; }
        .footer-badge {
            background: white;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 9px;
            color: #856404;
            font-weight: 500;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
            flex-shrink: 0;
        }
        @media (max-width: 700px) {
            .tabs { grid-template-columns: repeat(6, 1fr); }
            .tab-label { font-size: 9px; }
            #ggb-element { min-height: 400px; }
            .loading { height: 400px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-content">
                <div class="header-icon">📐</div>
                <div class="header-text">
                    <h1>利用 GGB 进行尺规作图</h1>
                    <p>原书：《利用几何画板探究数学解题模型》· 仅供学习用途</p>
                </div>
                <div class="version-badge">v1.5单独版</div>
                <div class="toggle-group">
                    <button class="toggle-btn" id="btnAlgebra" onclick="toggleAlgebra()" title="点击显示/隐藏左侧代数区，方便查看构造代码和给学生讲课">
                        <span>📊</span><span>代数区</span>
                    </button>
                    <button class="toggle-btn" id="btnText" onclick="toggleText()" title="点击显示/隐藏图内文字说明，方便给学生讲解构造过程">
                        <span>📝</span><span>文字说明</span>
                    </button>
                </div>
            </div>
        </div>
        <div class="tabs">
                <button class="tab active" onclick="loadGGB(4)">
                    <span class="tab-icon">🔄</span>
                    <span class="tab-label">角含半角</span>
                </button>
            </div>
        <div class="content">
            <div class="ggb-wrapper">
                <div class="ggb-container">
                    <!-- v1.9.7 缩放按钮组：浮动在绘图区右上角 -->
                    <div class="zoom-controls">
                        <button class="zoom-btn" onclick="zoomIn()" title="放大图形">🔍+</button>
                        <button class="zoom-btn" onclick="zoomOut()" title="缩小图形">🔍−</button>
                        <button class="zoom-btn" onclick="fitToScreen()" title="适应屏幕（显示全部）">⟲</button>
                    </div>
                    <div id="ggb-element">
                        <div class="loading">
                            <div class="loading-spinner"></div>
                            <div class="loading-text">正在加载 GeoGebra...</div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- v1.9.6 可折叠说明面板：默认收起，点击展开，不占用绘图空间 -->
            <div class="info-panel" id="infoPanel">
                <div class="info-header" onclick="toggleInfoPanel()">
                    <span class="info-title" id="infoTitle">📐 将军饮马模型</span>
                    <span class="info-toggle" id="infoToggle">▼</span>
                </div>
                <div class="info-content" id="infoContent" style="display:none;">
                    <div class="info-desc" id="infoDesc"></div>
                    <div class="info-op" id="infoOp"></div>
                </div>
            </div>
            <div class="footer">
                <div class="footer-icon">💡</div>
                <div class="footer-text">
                    <strong>使用提示</strong>
                    <p>拖动 GeoGebra 左上角滑块，观察图形运动和数值变化！顶部标签分两行切换18个演示。<strong>右上角两个按钮</strong>：📊<strong>代数区</strong>（点击弹出/隐藏，看代码讲课用）、📝<strong>文字说明</strong>（点击弹出/隐藏图内文字，给学生解释用）。<strong>绘图区右上角缩放按钮</strong>：🔍+放大、🔍−缩小、⟲适应屏幕（显示全部）。<strong>绘图区下方可折叠说明面板</strong>：点击标题展开/收起。v1.9.7新增：缩放控制按钮+自动适应屏幕，初始状态完整显示所有对象。</p>
                </div>
                <div class="footer-badge">1 个演示</div>
            </div>
        </div>
    </div>

        // v1.9.2 等比坐标系：每张图的内容范围（xmin/xmax/ymid）
        var VIEWS = [
            {title: "1.5 角含半角模型", desc: "正方形ABCD中，E在BC边上，F在CD边上，∠DAE=45°（角含半角）。核心结论：EF=BE+DF。尺规作图：旋转+平移生正方形→圆交BC生E→射线AE旋转-45°交CD生F。", op: "拖动点E在BC上移动，观察F点位置和EF长度变化；验证EF=BE+DF。", xmin: -1, xmax: 6, ymid: 2.5}
        ];
        var currentIndex = 0;
        var params = {
            "appName": "classic",
            "width": "100%",
            "height": "100%",
            "perspective": "G",
            "showToolBar": false,
            "showAlgebraInput": false,
            "showAlgebraWindow": false,
            "showMenuBar": false,
            "showResetIcon": true,
            "enableLabelDrags": false,
            "enableShiftDragZoom": true,
            "enableRightClick": false,
            "useBrowserForJS": false,
            "appletOnLoad": function(api) {
                ggbApp = api;
                loadGGB(0);
            }
        };
        var applet = new GGBApplet(params, true);
        applet.inject('ggb-element');

        // v1.9.4 切换状态全局变量
        var algebraVisible = false;  // 代数区默认隐藏
        var textVisible = false;      // 图内文字默认隐藏

        // v1.9.4 切换代数区显示/隐藏
        function toggleAlgebra() {
            algebraVisible = !algebraVisible;
            var btn = document.getElementById('btnAlgebra');
            btn.classList.toggle('active', algebraVisible);
            try {
                if (algebraVisible) {
                    ggbApp.setPerspective("A");  // 代数区+绘图区
                } else {
                    ggbApp.setPerspective("G");  // 只绘图区
                }
                // 延迟重新设置等比坐标系（切换perspective后坐标系会变）
                setTimeout(function() { setEqualRatio(currentIndex); }, 300);
                setTimeout(function() { setEqualRatio(currentIndex); }, 800);
            } catch(e) {
                console.warn('切换代数区失败:', e);
            }
        }

        // v1.9.4 切换图内文字说明显示/隐藏
        function toggleText() {
            textVisible = !textVisible;
            var btn = document.getElementById('btnText');
            btn.classList.toggle('active', textVisible);
            try {
                var allObjs = ggbApp.getAllObjectNames();
                for (var i = 0; i < allObjs.length; i++) {
                    var obj = allObjs[i];
                    if (ggbApp.getObjectType(obj) === "text") {
                        ggbApp.setVisible(obj, textVisible);
                    }
                }
            } catch(e) {
                console.warn('切换文字说明失败:', e);
            }
        }

        // v1.9.6 切换说明面板展开/收起
        function toggleInfoPanel() {
            var panel = document.getElementById('infoPanel');
            var content = document.getElementById('infoContent');
            panel.classList.toggle('expanded');
            if (panel.classList.contains('expanded')) {
                content.style.display = 'block';
            } else {
                content.style.display = 'none';
            }
        }

        // v1.9.7 缩放控制函数
        function zoomIn() {
            try { ggbApp.zoomIn(1.3); } catch(e) { console.warn('放大失败:', e); }
        }
        function zoomOut() {
            try { ggbApp.zoomOut(1.3); } catch(e) { console.warn('缩小失败:', e); }
        }

        // v1.9.7 适应屏幕：计算所有对象边界框，自动设置坐标系包含所有对象（等比）
        function fitToScreen() {
            try {
                var allObjs = ggbApp.getAllObjectNames();
                var xmin = Infinity, xmax = -Infinity, ymin = Infinity, ymax = -Infinity;
                var found = false;
                for (var i = 0; i < allObjs.length; i++) {
                    var obj = allObjs[i];
                    try {
                        var type = ggbApp.getObjectType(obj);
                        // 只考虑可见的点对象（几何图形的顶点）
                        if (type === "point" && ggbApp.getVisible(obj)) {
                            var x = ggbApp.getXcoord(obj);
                            var y = ggbApp.getYcoord(obj);
                            if (isFinite(x) && isFinite(y)) {
                                xmin = Math.min(xmin, x);
                                xmax = Math.max(xmax, x);
                                ymin = Math.min(ymin, y);
                                ymax = Math.max(ymax, y);
                                found = true;
                            }
                        }
                    } catch(e) {}
                }
                if (!found) {
                    // 没有找到点对象，用VIEWS预设范围
                    var v = VIEWS[currentIndex];
                    var sz = getViewSize();
                    var xr = v.xmax - v.xmin;
                    var yr = xr * sz.H / sz.W;
                    ggbApp.setCoordSystem(v.xmin, v.xmax, v.ymid - yr/2, v.ymid + yr/2);
                    return;
                }
                // 添加15%边距
                var xrange = xmax - xmin;
                var yrange = ymax - ymin;
                var margin = Math.max(xrange, yrange) * 0.15;
                xmin -= margin;
                xmax += margin;
                ymin -= margin;
                ymax += margin;
                // 确保等比（x/y单位像素相等）
                var sz = getViewSize();
                var xr = xmax - xmin;
                var yr = ymax - ymin;
                var targetYR = xr * sz.H / sz.W;
                if (targetYR > yr) {
                    // y范围不够，扩展y范围
                    var ycenter = (ymin + ymax) / 2;
                    ymin = ycenter - targetYR / 2;
                    ymax = ycenter + targetYR / 2;
                } else {
                    // x范围不够，扩展x范围
                    var targetXR = yr * sz.W / sz.H;
                    var xcenter = (xmin + xmax) / 2;
                    xmin = xcenter - targetXR / 2;
                    xmax = xcenter + targetXR / 2;
                }
                ggbApp.setCoordSystem(xmin, xmax, ymin, ymax);
            } catch(e) {
                console.warn('适应屏幕失败:', e);
            }
        }

        // v1.9.2 获取绘图区最大canvas的真实尺寸（不能用容器，包含工具栏/边框）
        function getViewSize() {
            var cs = document.querySelectorAll('canvas');
            var best = null, maxA = 0;
            cs.forEach(function(c) {
                var a = c.clientWidth * c.clientHeight;
                if (a > maxA) { maxA = a; best = c; }
            });
            return best ? { W: best.clientWidth, H: best.clientHeight } : { W: 800, H: 600 };
        }

        // v1.9.4 等比坐标系 + 隐藏坐标轴 + 根据textVisible决定是否隐藏文字
        function setEqualRatio(index) {
            try {
                var sz = getViewSize();
                var W = sz.W, H = sz.H;
                var v = VIEWS[index];
                var xr = v.xmax - v.xmin;
                var yr = xr * H / W;
                ggbApp.setCoordSystem(v.xmin, v.xmax, v.ymid - yr/2, v.ymid + yr/2);
                // 隐藏坐标轴和网格
                try { ggbApp.setAxesVisible(false, false); } catch(e) {}
                try { ggbApp.setGridVisible(false); } catch(e) {}
                // 根据textVisible决定是否隐藏文字说明（默认隐藏，用户可切换）
                try {
                    var allObjs = ggbApp.getAllObjectNames();
                    for (var i = 0; i < allObjs.length; i++) {
                        var obj = allObjs[i];
                        if (ggbApp.getObjectType(obj) === "text") {
                            ggbApp.setVisible(obj, textVisible);
                        }
                    }
                } catch(e) {}
            } catch(e) {
                console.warn('等比坐标系设置失败:', e);
            }
        }

        // v1.5单独版 标签设置函数：参考主技能标签方案存档
        // setCaption('$A$') + setLabelStyle(3) —— 3=CAPTION模式，显示caption
        // 注意：必须先SetCaption（会重置labelStyle），再SetLabelStyle=3
        function fixLabels() {
            try {
                var allObjs = ggbApp.getAllObjectNames();
                for (var i = 0; i < allObjs.length; i++) {
                    var obj = allObjs[i];
                    var otype = ggbApp.getObjectType(obj);
                    if (otype === "point") {
                        // 先SetCaption（会重置labelStyle），再SetLabelStyle=3（CAPTION模式）
                        var displayName = obj;
                        if (obj.length > 1 && obj.charAt(obj.length-1) === 'p') {
                            displayName = obj.substring(0, obj.length-1) + "'";
                        }
                        ggbApp.setCaption(obj, "$" + displayName + "$");
                        ggbApp.setLabelStyle(obj, 3);  // 3=CAPTION模式，显示caption
                        ggbApp.setLabelVisible(obj, true);
                    } else if (otype === "segment" || otype === "angle") {
                        ggbApp.setLabelVisible(obj, false);
                    }
                }
            } catch(e) {
                console.warn('标签设置失败:', e);
            }
        }

        function loadGGB(index) {
            currentIndex = index;
            var tabs = document.querySelectorAll('.tab');
            tabs.forEach(function(tab, i) {
                tab.classList.toggle('active', i === index);
            });
            // v1.9.6 更新可折叠说明面板内容
            try {
                var v = VIEWS[index];
                document.getElementById('infoTitle').textContent = '📐 ' + v.title;
                document.getElementById('infoDesc').textContent = v.desc;
                document.getElementById('infoOp').textContent = v.op;
            } catch(e) {}
            if (ggbApp) {
                ggbApp.setBase64(base64List[index], function() {
                    // v1.9.5 强制隐藏代数区（setBase64会重置perspective，必须在回调中再设）
                    if (!algebraVisible) {
                        try { ggbApp.setPerspective("G"); } catch(e) {}
                        try { ggbApp.setAlgebraVisible(false); } catch(e) {}
                    }
                    setEqualRatio(index);
                    fixLabels();  // v1.5单独版 标签设置：SetLabelStyle=1 + SetCaption LaTeX
                    setTimeout(function() {
                        if (!algebraVisible) {
                            try { ggbApp.setPerspective("G"); } catch(e) {}
                            try { ggbApp.setAlgebraVisible(false); } catch(e) {}
                        }
                        setEqualRatio(index);
                        fixLabels();  // v1.5单独版 延迟再次设置标签
                    }, 300);
                    setTimeout(function() {
                        if (!algebraVisible) {
                            try { ggbApp.setPerspective("G"); } catch(e) {}
                            try { ggbApp.setAlgebraVisible(false); } catch(e) {}
                        }
                        setEqualRatio(index);
                        fixLabels();  // v1.5单独版 延迟再次设置标签
                    }, 800);
                    setTimeout(function() {
                        if (!algebraVisible) {
                            try { ggbApp.setPerspective("G"); } catch(e) {}
                            try { ggbApp.setAlgebraVisible(false); } catch(e) {}
                        }
                        // v1.9.7 加载完成后自动适应屏幕，确保完整显示所有对象
                        fitToScreen();
                        fixLabels();  // v1.5单独版 最后再次设置标签
                    }, 1500);
                });
            }
        }

        // 窗口大小变化时重新设置等比坐标系
        window.addEventListener('resize', function() {
            if (ggbApp) { setEqualRatio(currentIndex); }
        });
    </script>
</body>
</html>
